manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: dhruvinsh
      url-base: https://github.com/dhruvinsh
    - name: duckyb
      url-base: https://github.com/duckyb
    - name: kumbung01
      url-base: https://github.com/kumbung01
    - name: nrfconnect
      url-base: https://github.com/nrfconnect
  # Revisions are pinned on purpose. `revision: main` meant every CI run could
  # pick up a different ZMK / module tree, so the same commit of this repo did
  # not produce the same firmware twice - and the ESB transport tracks ZMK's
  # split transport API, which is still moving.
  # Extra modules go under modules/ so the CI west cache (which caches
  # modules/, zephyr/, zmk/, ...) contains them. Do the same for new ones.
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: 268b1b1e82150460f00fd701bcd08583d5c75d29
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: bc114546392b4615ac90a99140eaf21dde31209d
      path: modules/zmk-helpers
    - name: zmk-auto-layer
      remote: urob
      revision: 62c201934711369d50a28df12e1d055d05cb6460
      path: modules/zmk-auto-layer
    - name: zmk-tri-state
      remote: dhruvinsh
      revision: ebbc1f0ccdb51669650bb0ac3e34920d09e62400
      path: modules/zmk-tri-state
    # Urchin shield (34 keys, nice!nano).
    - name: urchin-zmk-module
      remote: duckyb
      revision: a3ab64fa7779f82675695f3d7d17f705f840da25
      path: modules/urchin-zmk-module
    # The ESB split transport and its radio layer are not west projects: they
    # live in this repository, in extra-modules/zmk-split-esb (see its README).
    # nRF Connect SDK is still needed for the MPSL glue the radio layer links
    # against. Its own subsys/esb is not built (CONFIG_ESB stays off).
    # This is kumbung01's fork at the head of v3.1-branch-tdma-fhss, pinned to
    # a commit like everything else here.
    - name: sdk-nrf
      remote: kumbung01
      revision: 07b7e70c0d223429c58e6cffb4e6ecaa70ff949e
      path: nrf
    # nrfconnect/sdk-nrfxlib at the head of v3.1-branch.
    - name: nrfxlib
      remote: nrfconnect
      revision: dfadf17305d8f000eda9aa74a5b9ff1c5647a23e
      repo-path: sdk-nrfxlib
      path: nrfxlib
  self:
    path: config-esb

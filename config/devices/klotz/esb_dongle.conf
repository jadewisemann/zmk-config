# KLOTZ ESB dongle only.
#
# The keymap was tuned in the `ble` mode, where the left half is the central:
# its own keys are handled at once and the right half's wait for the next
# connection event (every 7.5 ms). Over ESB both halves are equally fast, which
# moves the point where a thumb hold-tap and a key of the other hand count as
# "released first" by those few milliseconds - Space followed by a right-hand
# letter turned into a Nav key more often. Pass the right half's keys on in the
# same 7.5 ms rhythm, so the timing between the hands is what it was.
# 1 is the right half (config/modes/esb_right.conf). Remove to get raw ESB timing.
CONFIG_ZMK_SPLIT_ESB_PACED_SOURCE=1

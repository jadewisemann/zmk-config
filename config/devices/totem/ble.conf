# TOTEM, every Bluetooth build (ble halves and the BLE dongle).
# ble.conf's EXPERIMENTAL_FEATURES implies ZMK_BLE_PASSKEY_ENTRY (via
# BT_SMP_ALLOW_UNAUTH_OVERWRITE). TOTEM pairs with macOS, where typing the
# passkey and pressing Enter does not complete pairing, so pair without it.
# The other Windows compatibility settings stay on.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

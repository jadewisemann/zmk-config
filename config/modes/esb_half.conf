# Both ESB halves. The transport stops TDMA on a peripheral that is
# idle (ZMK_IDLE_TIMEOUT, 30 s by default) as soon as its link desyncs, and the
# half then stays off the air until one of its own keys is pressed. Typing on
# one hand for 30 s was enough to drop the other half. Push idle out to the
# deep-sleep timeout (half.conf) so the radio keeps resyncing until sleep.
CONFIG_ZMK_IDLE_TIMEOUT=900000

# Keep the 32 MHz crystal running. The TDMA stack restarts it only ~366 us
# before each RX window; a crystal that is not stable yet loses the slot and
# skews the drift estimate, so a half desyncs at random within seconds.
# Provided by extra-modules/hfxo-always-on.
CONFIG_KB_HFXO_ALWAYS_ON=y

# Both halves of the BLE dongle mode (`bledongle`).
#
# A key press counts once the contact has been closed for this long; the
# default is 5 ms. With a dongle every key also waits for a Bluetooth
# connection event (0-7.5 ms) on its way, so the 4 ms saved here are most of
# what can be had: the connection interval is already the smallest Bluetooth
# allows. Release stays at 5 ms, so a bouncing contact still cannot type a key
# twice. On trial in this mode only; back to 5 if a key ever types by itself.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1

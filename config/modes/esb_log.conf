# ESB dongle with link diagnostics (the `dongle-log` firmware). Built with the
# zmk-usb-logging snippet, so the dongle is also a USB serial port; this turns
# on the once-per-second link statistics that are printed there. How to read
# them: extra-modules/zmk-split-esb/README.md.
CONFIG_ZMK_SPLIT_ESB_LINK_STATS=y

# The dongle of the test: what config/modes/esb_dongle.conf sets, without USB
# and battery reporting (the simulated board has neither), plus the link
# statistics run.py reads.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_ESB_RX_FIFO_SIZE=32
CONFIG_ZMK_SPLIT_ESB_LINK_STATS=y
